{% extends 'base.html' %}

{% block title %}Удалить рассылку{% endblock %}

{% block content %}
<h1>Удалить рассылку</h1>
<p>Вы уверены, что хотите удалить рассылку #{{ object.pk }}?</p>
<form method="post" class="card">
    {% csrf_token %}
    <div class="form-actions">
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'mailings:mailing_list' %}" class="btn">Отмена</a>
    </div>
</form>
{% endblock %}
